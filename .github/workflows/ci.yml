name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest

      - name: Build
        run: |
          echo "Build started"
          python -m compileall .
          echo "Build completed"

      - name: Deploy to staging
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Deploy started"
          echo "Application deployed to staging"